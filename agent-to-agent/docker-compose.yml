name: agent-to-agent

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 20s

services:
  postgres:
    # Mesma imagem dos testes de integracao (Testcontainers, BaseIntegrationTest)
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agents
      POSTGRES_USER: agents
      POSTGRES_PASSWORD: agents
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "55432:5432"
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U agents -d agents"]

  # AI Gateway self-hosted (docs/AI-GATEWAY.md). Os agentes nao dependem dele no startup: o cliente LLM e preguicoso,
  # e com LLM_PROVIDER=openrouter ele nem e usado.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./docker/litellm/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-poc}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:4000"
    healthcheck:
      <<: *healthcheck
      # imagem sem curl garantido; python sempre existe
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\" || exit 1"]

  cdb-mcp:
    build: ./cdb-mcp
    ports:
      - "8083:8083"
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/actuator/health || exit 1"]

  tracking-money-mcp:
    build: ./tracking-money-mcp
    ports:
      - "8082:8082"
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health || exit 1"]

  cred-mcp:
    build: ./cred-mcp
    ports:
      - "8084:8084"
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fs http://localhost:8084/actuator/health || exit 1"]

  investimentos-agent:
    build: ./investimentos-agent
    ports:
      - "8081:8081"
    environment:
      # Resolvidos por scripts/llm-env.sh a partir de LLM_PROVIDER (make up / llm-restart). Sem o script, cai no LiteLLM.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://litellm:4000/v1}
      LLM_API_KEY: ${LLM_API_KEY:-${LITELLM_MASTER_KEY:-sk-litellm-poc}}
      LLM_MODEL: ${LLM_MODEL:-${LITELLM_MODEL:-qwen-local}}
      A2A_PUBLIC_URL: http://investimentos-agent:8081
      CDB_MCP_URL: http://cdb-mcp:8083/mcp
      TRACKING_MONEY_MCP_URL: http://tracking-money-mcp:8082/mcp
      CRED_MCP_URL: http://cred-mcp:8084/mcp
      DB_URL: jdbc:postgresql://postgres:5432/agents?currentSchema=investimentos
    depends_on:
      postgres:
        condition: service_healthy
      cdb-mcp:
        condition: service_healthy
      tracking-money-mcp:
        condition: service_healthy
      cred-mcp:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || exit 1"]

  ana-agent:
    build: ./ana-agent
    ports:
      - "8080:8080"
    environment:
      # Resolvidos por scripts/llm-env.sh a partir de LLM_PROVIDER (make up / llm-restart). Sem o script, cai no LiteLLM.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://litellm:4000/v1}
      LLM_API_KEY: ${LLM_API_KEY:-${LITELLM_MASTER_KEY:-sk-litellm-poc}}
      LLM_MODEL: ${LLM_MODEL:-${LITELLM_MODEL:-qwen-local}}
      INVESTIMENTOS_A2A_URL: http://investimentos-agent:8081
      # MCP direto (solicitacoes de credito). Sem depends_on: a conexao e preguicosa e a Ana sobe sem o cred-mcp.
      CRED_MCP_URL: http://cred-mcp:8084/mcp
      DB_URL: jdbc:postgresql://postgres:5432/agents?currentSchema=ana
    depends_on:
      postgres:
        condition: service_healthy
      investimentos-agent:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]

  chat-web:
    build: ./chat-web
    ports:
      - "3000:3000"
    environment:
      # BFF: só o servidor Next fala com a Ana (rede do compose)
      ANA_URL: http://ana-agent:8080
    depends_on:
      ana-agent:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      # node:24-alpine não tem curl; wget do busybox resolve. 127.0.0.1 (não localhost):
      # o server standalone do Next liga em 0.0.0.0 e o busybox pode resolver localhost para ::1.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
